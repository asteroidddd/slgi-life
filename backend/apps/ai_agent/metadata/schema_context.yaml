    join_hint: gu_metric.gu_code = gu.gu_code
    note: "metric 테이블 컬럼은 metric_code, name, unit, category, cycle, is_generated 등.\
      \ metric_name 컬럼 없음\n최신값 비교는 보통 metric_code별 MAX(date)를 사용하거나 원하는 기간을 명시\n안전\
      \ 주요 코드: SAFETY_GRADE_MEAN(종합안전등급_평균), SAFETY_GRADE_CRIME, SAFETY_GRADE_TRAFFIC,\
      \ SAFETY_GRADE_FIRE, SAFETY_GRADE_LIFE, SAFETY_GRADE_DISEASE, SAFETY_GRADE_SUICIDE\n\
      인구 주요 코드: POP_TOTAL, POP_RESIDENT, POP_YOUTH_RATIO_19_34, POP_YOUTH_RATIO_19_39,\
      \ POP_YOUTH_19_34, POP_YOUTH_19_39, POP_ELDERLY_RATIO, POP_MEAN_AGE\n교통 주요 코드:\
      \ ACC_TOTAL_COUNT, ACC_PER_10K_POP, ACC_PER_1K_VEHICLE, ACC_DRUNK_RATIO, ACC_HITRUN_RATIO,\
      \ TRAFFIC_CULTURE_INDEX, TRAFFIC_CULTURE_WALK, TRAFFIC_CULTURE_SAFETY\n환경 주요\
      \ 코드: AREA_GREEN_RATIO, AREA_GREEN_PER_CAPITA, AREA_GREEN\n경제 주요 코드: LAND_PRICE_CHANGE_RATE,\
      \ HOUSING_COUNT, HOUSING_PER_CAPITA, GRDP_PER_CAPITA, GRDP_CURRENT\n값 방향성:\n\
      \  - SAFETY_GRADE_*: 단위가 '등급'. 1등급에 가까울수록 안전, 숫자가 낮을수록 좋음\n  - 사고/화재 건수·비율(ACC_*,\
      \ FIRE_COUNT): 낮을수록 좋음. 단순 건수보다 ACC_PER_10K_POP 같은 인구 보정 지표 우선\n  - TRAFFIC_CULTURE_*:\
      \ 단위가 '점'. 높을수록 교통문화/보행/안전 수준이 좋음\n  - POP_YOUTH_RATIO_19_34/19_39: 높을수록 청년\
      \ 비중이 큼. 대학가·자취 수요 해석에 유용\n  - POP_ELDERLY_RATIO/POP_MEAN_AGE: 높을수록 고령 비중/평균연령\
      \ 높음. 청년 밀집과 반대 신호로 해석 가능\n  - AREA_GREEN_RATIO/AREA_GREEN_PER_CAPITA: 높을수록\
      \ 녹지 접근성·환경 여건이 좋음\n  - LAND_PRICE_CHANGE_RATE: 양수면 지가 상승, 음수면 하락. 주거비 직접값은\
      \ 아니므로 월세 판단에는 rent_deal 우선\n  - HOUSING_PER_CAPITA: 높을수록 인구 대비 주택 수가 많음. 실제\
      \ 월세 수준은 rent_deal 평균으로 판단\n  - GRDP_PER_CAPITA/GRDP_CURRENT: 지역 경제 규모 참고용.\
      \ 자취 추천의 직접 조건으로 과해석 금지\n값 선택 규칙:\n  - '안전한 구' 질문은 SAFETY_GRADE_MEAN 최신값 ASC\
      \ 또는 score_safety DESC를 우선 사용\n  - '교통사고 적은 구' 질문은 ACC_PER_10K_POP 최신값 ASC 우선,\
      \ 없으면 ACC_TOTAL_COUNT ASC\n  - '청년 많은 구' 질문은 POP_YOUTH_RATIO_19_34 또는 POP_YOUTH_RATIO_19_39\
      \ 최신값 DESC\n  - '녹지/공원 환경 좋은 구' 질문은 AREA_GREEN_RATIO 또는 AREA_GREEN_PER_CAPITA\
      \ 최신값 DESC\n  - '교통문화 좋은 구' 질문은 TRAFFIC_CULTURE_INDEX 최신값 DESC\n"
